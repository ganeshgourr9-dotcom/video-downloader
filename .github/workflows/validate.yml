name: Validate VideoDrop Vinext Preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/real-download-engine, vinext-preview]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:vinext
        env:
          NEXT_PUBLIC_DOWNLOADER_API_URL: https://example.invalid
  downloader-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile downloader-service/app.py
